[project]
name = "alfred-computer-use"
version = "0.1.0"
description = "Alfred: talk to your Mac. Local speech recognition + one Jev (TypeSafe System One) call per command + macOS automation."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pyobjc-framework-applicationservices>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "sounddevice>=0.5.6",
    # The speech gate. Without it the energy detector opens the mic on any loud room.
    "silero-vad>=5.1.2",
    "onnxruntime>=1.20",
    "parakeet-mlx>=0.5.2",
]

[project.scripts]
alfred-computer-use = "alfred_computer_use.main:main"
# The old name, so launchers made before the rename (~/.local/bin/jev) keep working.
jev-voice = "alfred_computer_use.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfred_computer_use"]
